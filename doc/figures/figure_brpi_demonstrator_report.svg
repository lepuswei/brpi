    Entered HF = 5
  </text>
  <line x1="70.0" y1="460" x2="70.0" y2="466" stroke="#1c2a24"/><text x="70.0" y="480" text-anchor="middle" font-size="11" fill="#1c2a24">0</text><line x1="130.0" y1="460" x2="130.0" y2="466" stroke="#1c2a24"/><text x="130.0" y="480" text-anchor="middle" font-size="11" fill="#1c2a24">1</text><line x1="190.0" y1="460" x2="190.0" y2="466" stroke="#1c2a24"/><text x="190.0" y="480" text-anchor="middle" font-size="11" fill="#1c2a24">2</text><line x1="250.0" y1="460" x2="250.0" y2="466" stroke="#1c2a24"/><text x="250.0" y="480" text-anchor="middle" font-size="11" fill="#1c2a24">3</text><line x1="310.0" y1="460" x2="310.0" y2="466" stroke="#1c2a24"/><text x="310.0" y="480" text-anchor="middle" font-size="11" fill="#1c2a24">4</text><line x1="370.0" y1="460" x2="370.0" y2="466" stroke="#1c2a24"/><text x="370.0" y="480" text-anchor="middle" font-size="11" fill="#1c2a24">5</text><line x1="430.0" y1="460" x2="430.0" y2="466" stroke="#1c2a24"/><text x="430.0" y="480" text-anchor="middle" font-size="11" fill="#1c2a24">6</text><line x1="490.0" y1="460" x2="490.0" y2="466" stroke="#1c2a24"/><text x="490.0" y="480" text-anchor="middle" font-size="11" fill="#1c2a24">7</text>
  <line x1="64" y1="460.0" x2="70" y2="460.0" stroke="#1c2a24"/><text x="60" y="464.0" text-anchor="end" font-size="11" fill="#1c2a24">0.0</text><line x1="64" y1="420.0" x2="70" y2="420.0" stroke="#1c2a24"/><text x="60" y="424.0" text-anchor="end" font-size="11" fill="#1c2a24">0.2</text><line x1="64" y1="380.0" x2="70" y2="380.0" stroke="#1c2a24"/><text x="60" y="384.0" text-anchor="end" font-size="11" fill="#1c2a24">0.4</text><line x1="64" y1="340.0" x2="70" y2="340.0" stroke="#1c2a24"/><text x="60" y="344.0" text-anchor="end" font-size="11" fill="#1c2a24">0.6</text><line x1="64" y1="300.0" x2="70" y2="300.0" stroke="#1c2a24"/><text x="60" y="304.0" text-anchor="end" font-size="11" fill="#1c2a24">0.8</text><line x1="64" y1="260.0" x2="70" y2="260.0" stroke="#1c2a24"/><text x="60" y="264.0" text-anchor="end" font-size="11" fill="#1c2a24">1.0</text>
  <text x="280.0" y="502" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="12" fill="#1c2a24">Heartburn days (0–7)</text>
  <text x="24" y="360.0" transform="rotate(-90 24,360.0)" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1c2a24">Illustrative probability</text>
  <text x="28" y="500" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5a6b63">
    Illustrative—not clinically validated. Demonstration zones at 0.20 and 0.80 are not clinical cutoffs.
  </text>
</svg>
