  <rect x="70" y="420.0" width="420" height="-120.0" fill="#f3efd7" opacity="0.45"/>
  <rect x="70" y="260" width="420" height="160.0" fill="#d9efe6" opacity="0.45"/>
  <rect x="70" y="260" width="420" height="200" fill="none" stroke="#1c2a24" stroke-width="1.2"/>
